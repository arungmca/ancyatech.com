name: CI

on:
  push:
    branches: [main, v1, v2, stage]
  pull_request:
    branches: [main, v2, stage]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Page inventory
        run: |
          set -e
          test -f public/index.html
          test -f public/404.html
          for f in work.html work-foxtail-cafe.html journal.html journal-website-cost.html services-web-design.html about.html privacy-policy.html terms-of-service.html cookie-policy.html; do
            test -f "public/$f" || { echo "Missing public/$f"; exit 1; }
          done
          test -f public/assets/css/main.css
          test -f public/assets/js/site.js
          test -f public/assets/js/consent.js
          test -f docs/styleguide.html
          test -f docs/DESIGN_SPEC.md

      - name: Internal links
        run: python3 scripts/check_links.py

      - name: Home page structure and SEO
        run: |
          set -e
          for pattern in '<!DOCTYPE' '<html lang=' 'name="description"' 'property="og:title"' 'name="twitter:card"' 'rel="stylesheet"' '<script'; do
            grep -qi -- "$pattern" public/index.html || { echo "Missing $pattern in public/index.html"; exit 1; }
          done

      - name: Sitemap
        run: grep -q "<loc>" public/sitemap.xml
