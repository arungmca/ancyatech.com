version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Angular frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      dev-dependencies:
        dependency-type: development

  # Node backend
  - package-ecosystem: npm
    directory: /backend/node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Java backend (one of these will apply depending on the build tool chosen)
  - package-ecosystem: maven
    directory: /backend/java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /backend/java
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
