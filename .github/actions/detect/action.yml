name: Detect project layout
description: >-
  Inspects the repository and reports which buildable parts exist. CI/CD jobs
  consume these outputs so a static site, an Angular frontend and a Node or
  Java backend can be added to the repo without editing the workflows.

outputs:
  site_mode:
    description: '"angular", "static" or "none"'
    value: ${{ steps.detect.outputs.site_mode }}
  frontend_dir:
    description: Directory of the Angular app (or "." for the static site)
    value: ${{ steps.detect.outputs.frontend_dir }}
  frontend_lockfile:
    description: '"true" when the frontend has an npm lockfile'
    value: ${{ steps.detect.outputs.frontend_lockfile }}
  backend_node_dir:
    description: Directory of a Node backend, empty when absent
    value: ${{ steps.detect.outputs.backend_node_dir }}
  backend_node_lockfile:
    description: '"true" when the Node backend has an npm lockfile'
    value: ${{ steps.detect.outputs.backend_node_lockfile }}
  backend_java_dir:
    description: Directory of a Java backend, empty when absent
    value: ${{ steps.detect.outputs.backend_java_dir }}
  java_build:
    description: '"maven", "gradle" or "none"'
    value: ${{ steps.detect.outputs.java_build }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        set -euo pipefail
        out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

        norm() { (cd "$1" 2>/dev/null && pwd -P) || printf ''; }

        # --- Frontend / static site -------------------------------------
        site_mode="none"
        frontend_dir=""
        if [ -f frontend/angular.json ]; then
          site_mode="angular"; frontend_dir="frontend"
        elif [ -f angular.json ]; then
          site_mode="angular"; frontend_dir="."
        elif [ -f index.html ]; then
          site_mode="static"; frontend_dir="."
        fi

        frontend_lockfile="false"
        case "$site_mode" in
          angular)
            if [ -f "$frontend_dir/package-lock.json" ] || \
               [ -f "$frontend_dir/npm-shrinkwrap.json" ]; then
              frontend_lockfile="true"
            fi
            ;;
        esac

        # --- Node backend ------------------------------------------------
        # Looked up in the conventional locations first so an Angular
        # workspace at the repo root is never mistaken for a backend.
        frontend_abs="$(norm "${frontend_dir:-.}")"
        backend_node_dir=""
        for candidate in backend/node backend server api .; do
          [ -f "$candidate/package.json" ] || continue
          candidate_abs="$(norm "$candidate")"
          if [ -n "$frontend_abs" ] && [ "$candidate_abs" = "$frontend_abs" ] && \
             [ "$site_mode" = "angular" ]; then
            continue
          fi
          backend_node_dir="$candidate"
          break
        done

        backend_node_lockfile="false"
        if [ -n "$backend_node_dir" ] && \
           { [ -f "$backend_node_dir/package-lock.json" ] || \
             [ -f "$backend_node_dir/npm-shrinkwrap.json" ]; }; then
          backend_node_lockfile="true"
        fi

        # --- Java backend -------------------------------------------------
        backend_java_dir=""
        java_build="none"
        for candidate in backend/java backend server api .; do
          if [ -f "$candidate/pom.xml" ]; then
            backend_java_dir="$candidate"; java_build="maven"; break
          fi
          if [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ]; then
            backend_java_dir="$candidate"; java_build="gradle"; break
          fi
        done

        out site_mode "$site_mode"
        out frontend_dir "$frontend_dir"
        out frontend_lockfile "$frontend_lockfile"
        out backend_node_dir "$backend_node_dir"
        out backend_node_lockfile "$backend_node_lockfile"
        out backend_java_dir "$backend_java_dir"
        out java_build "$java_build"

        {
          echo "### Repository layout"
          echo "| Part | Detected |"
          echo "| --- | --- |"
          echo "| Site mode | \`$site_mode\` |"
          echo "| Frontend dir | \`${frontend_dir:-—}\` |"
          echo "| Node backend | \`${backend_node_dir:-—}\` |"
          echo "| Java backend | \`${backend_java_dir:-—}\` (\`$java_build\`) |"
        } >> "$GITHUB_STEP_SUMMARY"
