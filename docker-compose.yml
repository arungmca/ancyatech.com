services:
  cloudflare:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # Required to reach the NAS itself and other LAN IPs for private-network
    # (WARP) routing. Do not combine with `ports:`.
    network_mode: host
    environment:
      # Equivalent to `--token`, but keeps the secret out of the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
      # TUNNEL_LOGLEVEL: info
    command: tunnel --no-autoupdate run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

        